<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/medtrack-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedTrack – AVS | Hospital Asset Tracking & Geolocation Dashboard</title>
    <meta name="description" content="Real-time hospital asset tracking system and mobile medical equipment geolocation dashboard utilizing QR identification, physical GPS telemetry, and live geofencing." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://med-track-avs.vercel.app/" />

    <!-- Open Graph / Social Media Meta -->
    <meta property="og:title" content="MedTrack – AVS | Hospital Asset Tracking & Geolocation Dashboard" />
    <meta property="og:description" content="Real-time hospital asset tracking system and mobile medical equipment geolocation dashboard utilizing QR identification, physical GPS telemetry, and live geofencing." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://med-track-avs.vercel.app/" />
    <meta property="og:image" content="https://med-track-avs.vercel.app/medtrack-logo.svg" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalOrganization",
      "name": "MedTrack – AVS",
      "url": "https://med-track-avs.vercel.app/",
      "logo": "https://med-track-avs.vercel.app/medtrack-logo.svg",
      "description": "Real-time hospital asset tracking system and mobile medical equipment geolocation dashboard utilizing QR identification, physical GPS telemetry, and live geofencing."
    }
    </script>

    <!-- Non-render-blocking Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" media="print" data-fonts-css="true">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
    </noscript>

    <!-- Critical Above-the-Fold Styling for Instant Mobile Initial Rendering -->
    <style id="medtrack-critical-css">
      :root {
        --primary: #005c55;
        --primary-hover: #004b45;
        --secondary: #006b5f;
        --surface: #f7f9fb;
        --on-surface: #191c1e;
        --surface-variant: #e0e3e5;
        --font-family-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-family-display: 'Plus Jakarta Sans', 'Inter', sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font-family-sans);
        background-color: var(--surface);
        color: var(--on-surface);
        -webkit-font-smoothing: antialiased;
      }
      .app-header {
        height: 64px;
        background: rgba(247, 249, 251, 0.94);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--surface-variant);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
      }
      .min-vh-100 { min-height: 100vh; }
      .d-flex { display: flex; }
      .d-inline-flex { display: inline-flex; }
      .flex-column { flex-direction: column; }
      .flex-grow-1 { flex-grow: 1; }
      .flex-wrap { flex-wrap: wrap; }
      .align-items-center { align-items: center; }
      .justify-content-between { justify-content: space-between; }
      .gap-2 { gap: 0.5rem; }
      .gap-3 { gap: 1rem; }
      .gap-4 { gap: 1.5rem; }
      .gap-5 { gap: 3rem; }
      .px-3 { padding-left: 1rem; padding-right: 1rem; }
      .px-4 { padding-left: 1.5rem; padding-right: 1.5rem; }
      .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .py-4 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
      .py-5 { padding-top: 3rem; padding-bottom: 3rem; }
      .mb-0 { margin-bottom: 0; }
      .mb-1 { margin-bottom: 0.25rem; }
      .mb-3 { margin-bottom: 1rem; }
      .mb-4 { margin-bottom: 1.5rem; }
      .text-decoration-none { text-decoration: none; }
      .fw-bold { font-weight: 700; }
      .fw-semibold { font-weight: 600; }
      .fs-5 { font-size: 1.25rem; }
      .fs-6 { font-size: 1rem; }
      .display-5 { font-size: calc(1.425rem + 2.1vw); font-weight: 700; line-height: 1.2; font-family: var(--font-family-display); }
      @media (min-width: 1200px) { .display-5 { font-size: 3rem; } }
      .lead { font-size: 1.1rem; font-weight: 400; line-height: 1.5; }
      .text-muted { color: #475569 !important; }
      .rounded-2 { border-radius: 0.375rem; }
      .rounded-pill { border-radius: 50rem; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        vertical-align: middle;
        cursor: pointer;
        user-select: none;
        border: 1px solid transparent;
        transition: all 0.15s ease-in-out;
      }
      .btn-sm { padding: 0.25rem 0.75rem; font-size: 0.875rem; }
      .btn-stitch-primary {
        background-color: var(--primary);
        color: #ffffff !important;
        border: none;
        border-radius: 8px;
      }
      .btn-stitch-primary:hover { background-color: var(--primary-hover); color: #ffffff !important; }
      .btn-stitch-secondary {
        background-color: transparent;
        color: var(--primary) !important;
        border: 1px solid var(--primary);
        border-radius: 8px;
      }
      .btn-outline-primary {
        color: var(--primary);
        border-color: var(--primary);
        background-color: transparent;
      }
      .container-xl { width: 100%; padding-right: 0.75rem; padding-left: 0.75rem; margin-right: auto; margin-left: auto; max-width: 1320px; }
      .row { display: flex; flex-wrap: wrap; margin-right: -0.75rem; margin-left: -0.75rem; }
      .col-12 { flex: 0 0 auto; width: 100%; padding-right: 0.75rem; padding-left: 0.75rem; }
      @media (min-width: 992px) {
        .col-lg-6 { flex: 0 0 auto; width: 50%; padding-right: 0.75rem; padding-left: 0.75rem; }
        .px-lg-5 { padding-left: 3rem; padding-right: 3rem; }
        .py-lg-5 { padding-top: 3rem; padding-bottom: 3rem; }
      }
      @media (max-width: 767.98px) {
        .d-md-flex { display: none !important; }
      }
      @media (max-width: 575.98px) {
        .d-sm-inline-flex { display: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- Instant Pre-Rendered Hero Shell (Cleanly removed when React mounts) -->
    <div id="initial-shell" class="min-vh-100 d-flex flex-column" style="background-color: var(--surface); color: var(--on-surface); position: absolute; top: 0; left: 0; width: 100%; z-index: 100;">
      <header class="app-header d-flex align-items-center justify-content-between px-3 px-lg-5">
        <div class="d-flex align-items-center gap-2">
          <a href="/" class="d-flex align-items-center gap-2 text-decoration-none">
            <img src="/medtrack-logo.svg" alt="MedTrack Logo" width="34" height="34" class="rounded-2" />
            <span class="fs-5 fw-bold" style="color: var(--primary); letter-spacing: -0.02em;">
              MedTrack <span style="color: var(--secondary);">– AVS</span>
            </span>
          </a>
        </div>
        <nav class="d-none d-md-flex align-items-center gap-4">
          <a href="/" class="text-decoration-none fw-bold" style="color: var(--primary);">Home</a>
          <a href="/about" class="text-decoration-none text-muted fw-semibold">About Project</a>
          <a href="/login" class="text-decoration-none text-muted fw-semibold">Login</a>
          <a href="/register" class="text-decoration-none text-muted fw-semibold">Register</a>
        </nav>
        <div class="d-flex align-items-center gap-2">
          <a href="/login" class="btn btn-sm btn-outline-primary d-none d-sm-inline-flex px-3 py-1 rounded-2 fw-semibold" style="color: var(--primary); border-color: var(--primary);">Sign In</a>
          <a href="/dashboard" class="btn btn-sm btn-stitch-primary px-3 py-1 rounded-2">Enter Dashboard</a>
        </div>
      </header>
      <main class="flex-grow-1" style="padding-top: 64px;">
        <section class="py-5 px-3 px-md-5 position-relative overflow-hidden" style="background: linear-gradient(135deg, rgba(15, 118, 110, 0.08) 0%, var(--surface) 60%, rgba(0, 107, 95, 0.08) 100%);">
          <div class="container-xl py-4 py-lg-5">
            <div class="row align-items-center g-5">
              <div class="col-12 col-lg-6">
                <div class="d-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill mb-3" style="background-color: rgba(15, 118, 110, 0.12); color: var(--primary); font-size: 0.8rem; font-weight: 600;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                  <span>Next-Gen Asset Tracking</span>
                </div>
                <h1 class="display-5 fw-bold mb-3 lh-sm" style="letter-spacing: -0.02em;">
                  Know Where Every Medical Asset Is.
                </h1>
                <p class="lead text-muted mb-4" style="font-size: 1.1rem;">
                  Track mobile medical equipment in real time using QR identification, GPS location telemetry, and a live hospital interactive map.
                </p>
                <div class="d-flex flex-wrap gap-3">
                  <a href="/register" class="btn btn-stitch-primary px-4 py-2 fs-6">Get Started</a>
                  <a href="/dashboard" class="btn btn-stitch-secondary px-4 py-2 fs-6">Explore Dashboard</a>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script>
      (function() {
        var p = window.location.pathname;
        if (p && p !== '/' && p !== '/index.html') {
          var s = document.getElementById('initial-shell');
          if (s) s.remove();
        }

        function activateStyles() {
          var f = document.querySelector('link[data-fonts-css]');
          if (f && f.media !== 'all') f.media = 'all';
          var a = document.querySelector('link[data-app-css]');
          if (a && a.media !== 'all') a.media = 'all';
        }

        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(activateStyles, { timeout: 3000 });
        } else {
          setTimeout(activateStyles, 2500);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
