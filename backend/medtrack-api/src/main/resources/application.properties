# ==============================================================================
# MedTrack – AVS (Hospital Asset Tracking System & Geolocation Dashboard)
# Spring Boot Configuration
# ==============================================================================

spring.application.name=medtrack-api
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework


# Database Configuration (MySQL / MariaDB)
# Supports:
# 1. Direct DB_URL (or JDBC_DATABASE_URL)
# 2. Railway MySQL environment variables (MYSQLHOST, MYSQLPORT, MYSQLDATABASE)
# 3. Local default fallback (localhost:3306)
spring.datasource.url=${DB_URL:${JDBC_DATABASE_URL:jdbc:mariadb://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:medtrack_db}?useSSL=false&allowPublicKeyRetrieval=true&timezone=UTC}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Google OAuth2 Client Configuration (Foundation for Phase 11)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# JWT Security Token Configuration (Fail-closed: requires JWT_SECRET in environment)
medtrack.jwt.secret=${JWT_SECRET:}
medtrack.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (In production, set CORS_ALLOWED_ORIGINS to deployed frontend domain e.g. https://your-app.vercel.app)
medtrack.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${MEDTRACK_CORS_ALLOWED_ORIGINS:*}}

# OAuth2 Frontend Redirect URI
medtrack.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/auth/callback}

# Dev Seed Password Configuration (Optional)
medtrack.dev.admin-password=${MEDTRACK_DEV_ADMIN_PASSWORD:}
medtrack.dev.supervisor-password=${MEDTRACK_DEV_SUPERVISOR_PASSWORD:}
medtrack.dev.staff-password=${MEDTRACK_DEV_STAFF_PASSWORD:}

# Admin Email Allowlist for Google OAuth Provisioning (comma-separated, normalized)
medtrack.admin.emails=${MEDTRACK_ADMIN_EMAILS:vigneshwarans4444@gmail.com}

# ==============================================================================
# Phase 20: Performance, Compression & Actuator Hardening
# ==============================================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

# ==============================================================================
# Phase 20.1: MedTrack AVS AI Foundation & Secure Cloud API Configuration
# ==============================================================================
medtrack.ai.provider=${AI_PROVIDER:GEMINI}
medtrack.ai.api-key=${AI_API_KEY:}
medtrack.ai.model=${AI_MODEL:gemini-3.8-flash}
medtrack.ai.api-base-url=${AI_API_BASE_URL:}
medtrack.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
medtrack.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:30000}

# ==============================================================================
# Phase 7: Architectural Floor Plan Multipart Upload Configuration
# ==============================================================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB


