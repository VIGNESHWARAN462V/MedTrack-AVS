# Test Profile Configuration (H2 In-Memory)
spring.application.name=medtrack-api-test

spring.datasource.url=jdbc:h2:mem:medtrack_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dummy OAuth2 registration for test context
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret

medtrack.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
medtrack.jwt.expiration-ms=86400000
medtrack.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Test Profile: Enable demonstration seeding by default for integration test suites
medtrack.seed.demo-data=true
